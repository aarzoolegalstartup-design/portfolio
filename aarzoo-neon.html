<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aarzoo | Digital Marketing Specialist – SEO, Social Media & Web Development</title>
<meta name="description" content="Aarzoo is a Digital Marketing Specialist focused on SEO, social media marketing, website development and online brand growth.">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#04060c;--bl:#00b8ff;--bl2:#3a6bff;--tx:#e9f2ff;--mu:#8da2c3;--ln:rgba(120,170,255,.16);--d:'Space Grotesk',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.7 var(--b);overflow-x:hidden}
a{color:inherit;text-decoration:none}ul,ol{list-style:none}img{max-width:100%;display:block}
.wrap{width:min(1180px,90%);margin:auto;position:relative;z-index:2}.narrow{width:min(760px,90%)}
section{position:relative;padding:clamp(5rem,11vw,9rem) 0;overflow:hidden}
section:nth-of-type(even){background:linear-gradient(180deg,transparent,rgba(0,110,255,.06),transparent)}
h1,h2,h3{font-family:var(--d);line-height:1.05;letter-spacing:-.03em}
h2{font-size:clamp(2rem,5vw,3.8rem);max-width:16ch;margin-bottom:3rem}
.mut{color:var(--mu)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}.w>span{display:inline-block}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.o1{width:40vmax;height:40vmax;right:-12%;top:-10%;background:radial-gradient(circle,rgba(0,184,255,.4),transparent 70%)}
.o2{width:32vmax;height:32vmax;left:-14%;bottom:-12%;background:radial-gradient(circle,rgba(58,107,255,.35),transparent 70%)}
.o3{width:36vmax;height:36vmax;left:30%;top:10%;background:conic-gradient(from 0deg,rgba(0,184,255,.3),rgba(58,107,255,.1),rgba(0,184,255,.3));animation:rot 20s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* Nav */
.nav{position:fixed;inset:0 0 auto;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:1rem 5%;backdrop-filter:blur(14px);background:rgba(4,6,12,.55);border-bottom:1px solid var(--ln)}
.logo{font:700 1.4rem var(--d);letter-spacing:.08em}.logo span{color:var(--bl)}
.nav nav{display:flex;gap:2rem}
.nav nav a{position:relative;font-size:.92rem;color:var(--mu);transition:color .3s}
.nav nav a::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:var(--bl);box-shadow:0 0 10px var(--bl);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.nav nav a:hover,.nav nav a.on{color:var(--tx)}.nav nav a:hover::after,.nav nav a.on::after{transform:scaleX(1)}
.burger{display:none;background:none;border:0;width:44px;height:44px;position:relative;z-index:70}
.burger i{position:absolute;left:10px;right:10px;height:2px;background:var(--tx);transition:.4s}.burger i:first-child{top:17px}.burger i:last-child{top:25px}
.burger[aria-expanded=true] i:first-child{top:21px;transform:rotate(45deg)}.burger[aria-expanded=true] i:last-child{top:21px;transform:rotate(-45deg)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.7rem;padding:1rem 2rem;border-radius:99px;border:0;cursor:pointer;font:500 1rem var(--b);color:#02101a;background:linear-gradient(90deg,var(--bl),#6fd8ff);box-shadow:0 0 30px rgba(0,184,255,.45);transition:box-shadow .4s,filter .4s}
.btn:hover{box-shadow:0 0 60px rgba(0,184,255,.8);filter:brightness(1.1)}.btn.sm{padding:.6rem 1.2rem;font-size:.9rem}
:focus-visible{outline:2px solid var(--bl);outline-offset:3px}
/* Hero */
.hero{min-height:100svh;display:flex;align-items:center;padding-top:7rem;background:radial-gradient(ellipse at 70% 20%,#0a1a3a,var(--bg) 65%)}
#fx{position:absolute;inset:0;width:100%;height:100%}
.kick{color:var(--bl);letter-spacing:.25em;font-size:.85rem;margin-bottom:1.2rem}
.hero h1{font-size:clamp(2.8rem,8.4vw,7.4rem);max-width:11ch;margin-bottom:1.6rem;text-shadow:0 0 60px rgba(0,184,255,.25)}
.hero h1 .w:nth-child(n+2):nth-child(-n+3) span{background:linear-gradient(90deg,#fff,var(--bl));-webkit-background-clip:text;color:transparent}
.sub{max-width:52ch;color:var(--mu);font-size:1.15rem;margin-bottom:2.2rem}
.chips{position:absolute;right:6%;top:0;bottom:0;width:30%;z-index:1;pointer-events:none}
.chip{position:absolute;display:flex;gap:.6rem;align-items:center;padding:.8rem 1.3rem;border-radius:99px;background:rgba(0,184,255,.08);border:1px solid rgba(0,184,255,.4);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(0,184,255,.2);animation:fl 6s ease-in-out infinite}
.chip i{color:var(--bl)}.c1{top:24%;left:10%}.c2{top:40%;right:0;animation-delay:-2s}.c3{top:58%;left:0;animation-delay:-4s}.c4{top:72%;right:12%;animation-delay:-1s}
@keyframes fl{50%{transform:translateY(-22px)}}
.scroll{position:absolute;bottom:1.6rem;left:50%;width:26px;height:44px;margin-left:-13px;border:2px solid var(--mu);border-radius:14px;z-index:2}
.scroll i{position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:4px;background:var(--bl);animation:sc 1.8s infinite}
@keyframes sc{60%{transform:translateY(16px);opacity:0}}
/* Cards */
.card{position:relative;padding:2rem;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--ln);backdrop-filter:blur(10px);transform-style:preserve-3d;transition:box-shadow .4s}
.card:hover{box-shadow:0 0 60px rgba(0,184,255,.2)}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0),var(--bl),transparent 60%);opacity:0;transition:opacity .4s;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glow:hover::before{opacity:1}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.3rem;color:var(--bl);background:rgba(0,184,255,.1);border:1px solid rgba(0,184,255,.35);margin-bottom:1.4rem;box-shadow:inset 0 0 24px rgba(0,184,255,.25);transform:translateZ(30px)}
.card h3{font-size:1.5rem;margin-bottom:.6rem}.card p{color:var(--mu);font-size:.96rem}
.grid{display:grid;gap:1.5rem;perspective:1200px}
/* About */
.split{max-width:820px}
.pic{position:relative;max-width:420px;aspect-ratio:1;justify-self:center;width:100%}
.face{position:absolute;inset:8%;border-radius:38% 62% 55% 45%/50% 40% 60% 50%;overflow:hidden;background:linear-gradient(145deg,#0b2a55,var(--bl2));display:grid;place-items:center;box-shadow:0 0 80px rgba(0,184,255,.35);animation:morph 10s ease-in-out infinite}
.face span{font:700 6rem var(--d);color:rgba(255,255,255,.85)}.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes morph{50%{border-radius:60% 40% 42% 58%/42% 58% 42% 58%}}
.ring{position:absolute;inset:0;border:1px dashed rgba(0,184,255,.5);border-radius:50%;animation:rot 24s linear infinite}
.dec{position:absolute;border-radius:50%;background:var(--bl);box-shadow:0 0 30px var(--bl)}.d1{width:18px;height:18px;top:10%;right:8%}.d2{width:10px;height:10px;bottom:14%;left:4%;background:var(--bl2)}
.lead{font:500 1.5rem/1.4 var(--d);margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.2rem}
.stat{padding:1.2rem;border-left:2px solid var(--bl);background:rgba(0,184,255,.05)}.stat b{display:block;font:700 2.6rem var(--d);color:var(--bl);text-shadow:0 0 24px rgba(0,184,255,.5)}.stat span{font-size:.85rem;color:var(--mu)}
/* Skills (offset columns) */
.skills{grid-template-columns:repeat(3,1fr)}.skills .card:nth-child(3n+2){margin-top:3rem}
/* Services (asymmetric 12-col) */
.svc{grid-template-columns:repeat(12,1fr)}.svc .card{grid-column:span 4;overflow:hidden}
.svc .card:nth-child(1){grid-column:span 7;border-radius:80px 24px 24px 24px}.svc .card:nth-child(2){grid-column:span 5;border-radius:24px 80px 24px 24px}
.svc .card:nth-child(6){grid-column:span 12;border-radius:24px 24px 24px 80px}
.num{position:absolute;right:1.5rem;top:.6rem;font:700 4rem var(--d);color:transparent;-webkit-text-stroke:1px rgba(0,184,255,.35)}
/* Work (bento) */
.work{grid-template-columns:repeat(12,1fr)}.work .proj{grid-column:span 5;padding:0;overflow:hidden}.work .proj:nth-child(1),.work .proj:nth-child(4){grid-column:span 7}
.im{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#0a2350,var(--bl2) 60%,var(--bl))}
.im img,.phi{width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1)}.im img{object-fit:cover}
.phi{display:grid;place-items:center;font-size:3.5rem;color:rgba(255,255,255,.7)}.proj:hover .im>*{transform:scale(1.1)}
.pb{padding:1.6rem 2rem 2rem}.pb small{color:var(--bl);font-size:.8rem;letter-spacing:.08em}.pb h3{margin:.3rem 0 .5rem}.pb .btn{margin-top:1.2rem}
/* Timeline */
.tl{position:relative;padding-left:3rem}.line{position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--ln)}
.line i{display:block;height:100%;background:linear-gradient(var(--bl),var(--bl2));box-shadow:0 0 14px var(--bl);transform-origin:top}
.ti{position:relative;margin-bottom:2rem}.ti:nth-child(odd){margin-left:clamp(0px,6vw,80px)}
.ti::before{content:"";position:absolute;left:-2.55rem;top:2rem;width:14px;height:14px;border-radius:50%;background:var(--bl);box-shadow:0 0 0 6px rgba(0,184,255,.2),0 0 20px var(--bl)}
.ti small{color:var(--bl);font-weight:500}
/* Tools */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;perspective:1000px}
.tool{text-align:center;padding:1.6rem 1rem}.tool i{font-size:2rem;color:var(--bl);margin-bottom:.8rem;display:block;transition:transform .4s,text-shadow .4s}.tool:hover i{transform:scale(1.2);text-shadow:0 0 24px var(--bl)}.tool span{font-size:.9rem}
/* Testimonials */
.tm{grid-template-columns:repeat(3,1fr)}.tm .card:nth-child(2){margin-top:2.5rem}.tm .fa-quote-left{color:var(--bl);font-size:1.6rem;margin-bottom:1rem}.tm b{display:block;margin-top:1.2rem;font-family:var(--d)}.tm small{color:var(--mu)}
/* Contact */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
.info h2{font-size:clamp(1.9rem,3.8vw,3rem);max-width:none}.info li{margin-bottom:1rem}.info a{display:flex;gap:1rem;align-items:center;color:var(--mu);transition:color .3s}.info a:hover{color:var(--bl)}.info i{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(0,184,255,.4);color:var(--bl)}
.form{display:grid;gap:1.1rem}.form label{display:grid;gap:.35rem;font-size:.9rem}
.form input,.form textarea{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:14px;padding:.9rem 1rem;color:var(--tx);font:inherit;outline:none;transition:.3s}
.form input:focus,.form textarea:focus{border-color:var(--bl);box-shadow:0 0 24px rgba(0,184,255,.25)}
.form [aria-invalid=true]{border-color:#ff6b81}.err{color:#ff8a9b;min-height:1em;font-size:.8rem}.form .btn{justify-self:start}#fmsg{font-size:.9rem;color:var(--mu)}
/* Footer */
footer{border-top:1px solid var(--ln);padding:3rem 0 1.5rem;background:#03050a}
.fgrid{display:grid;grid-template-columns:1.2fr 1fr auto;gap:2rem;align-items:start}.fgrid nav{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem}.fgrid nav a{color:var(--mu)}.fgrid nav a:hover{color:var(--bl)}
.soc{display:flex;gap:.6rem}.soc a{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--ln);border-radius:50%;transition:.4s}.soc a:hover{border-color:var(--bl);color:var(--bl);box-shadow:0 0 20px rgba(0,184,255,.5)}
.fb{margin-top:2rem;color:var(--mu);font-size:.85rem}
#top{position:fixed;right:1.2rem;bottom:1.2rem;z-index:55;width:46px;height:46px;border-radius:50%;border:1px solid var(--bl);background:rgba(4,6,12,.8);color:var(--bl);cursor:pointer;opacity:0;pointer-events:none;transition:.4s;box-shadow:0 0 20px rgba(0,184,255,.4)}#top.show{opacity:1;pointer-events:auto}
/* Preloader, progress, cursor */
#pre{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;text-align:center}
#pl{display:block;font:700 clamp(2.4rem,10vw,6rem) var(--d);letter-spacing:.12em}#pl span{display:inline-block}#pl span:last-child{color:var(--bl)}
#pre i{display:block;height:2px;width:min(260px,60vw);margin:1rem auto;background:var(--bl);box-shadow:0 0 16px var(--bl);transform:scaleX(0)}#pt{color:var(--mu);font-size:.95rem}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;background:linear-gradient(90deg,var(--bl2),var(--bl));transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px var(--bl)}
.cur{display:none}
@media(pointer:fine){body,a,button{cursor:none}.cur{display:block;position:fixed;top:0;left:0;z-index:998;pointer-events:none;border-radius:50%}
#cr{width:44px;height:44px;margin:-22px;border:1px solid var(--bl);background:radial-gradient(circle,rgba(0,184,255,.25),transparent 70%);box-shadow:0 0 30px rgba(0,184,255,.4);transition:width .3s,height .3s,margin .3s}
#cr.on{width:76px;height:76px;margin:-38px}.dot{width:6px;height:6px;margin:-3px;background:var(--bl)}}
/* Responsive */
@media(max-width:960px){.burger{display:block}
.nav nav{position:fixed;inset:0 0 0 auto;width:min(80vw,340px);flex-direction:column;justify-content:center;gap:1.6rem;padding:2rem;background:rgba(4,6,12,.96);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .5s cubic-bezier(.7,0,.2,1)}
.nav nav.open{transform:none}.nav nav a{font-size:1.5rem;color:var(--tx)}
.split,.cgrid,.fgrid{grid-template-columns:1fr}.chips{display:none}.skills,.tm{grid-template-columns:1fr 1fr}.skills .card:nth-child(3n+2),.tm .card:nth-child(2){margin-top:0}
.svc .card,.svc .card:nth-child(n){grid-column:span 12}.work .proj,.work .proj:nth-child(n){grid-column:span 12}}
@media(max-width:600px){.skills,.tm,.stats{grid-template-columns:1fr}.ti:nth-child(odd){margin-left:0}.hero h1{max-width:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

</style>
</head>

const card = (cls, inner) => `<article class="card glow tilt ${cls}" data-r>${inner}</article>`;

/* ---------- Render ---------- */
$("#h1").innerHTML = split("Building Digital Experiences That Drive Growth.");
$("#sub").textContent = C.hero; $("#a1").textContent = C.about1; $("#a2").textContent = C.about2;
$("#pt").textContent = C.tagline; $("#ftag").textContent = C.tagline;
$("#pl").innerHTML = [...C.name.toUpperCase()].map(l => `<span>${l}</span>`).join("") + "<span>.</span>";
$$(".st").forEach(h => h.innerHTML = split(h.textContent));
$("#stats").innerHTML = [[C.skills.length, "Core skills"], [C.services.length, "Services"], [C.tools.length, "Tools"]].map(s => `<div class="stat" data-r><b data-n="${s[0]}">0</b><span>${s[1]}</span></div>`).join("");
$("#skillGrid").innerHTML = C.skills.map(s => card("", `<span class="ic"><i class="${s[0]}"></i></span><h3>${s[1]}</h3><p>${s[2]}</p>`)).join("");
$("#svcGrid").innerHTML = C.services.map((s, i) => card("", `<span class="num">0${i + 1}</span><span class="ic"><i class="${s[0]}"></i></span><h3>${s[1]}</h3><p>${s[2]}</p>`)).join("");
$("#toolGrid").innerHTML = C.tools.map(t => card("tool", `<i class="${t[0]}"></i><span>${t[1]}</span>`)).join("");
const links = [["fa-solid fa-envelope", `mailto:${C.email}`, C.email], ["fa-brands fa-whatsapp", `https://wa.me/${C.whatsapp}`, "WhatsApp"], ["fa-brands fa-linkedin-in", C.linkedin, "LinkedIn"], ["fa-brands fa-instagram", C.instagram, "Instagram"]];
$("#info").innerHTML = links.map(l => `<li><a href="${l[1]}" target="_blank" rel="noopener"><i class="${l[0]}"></i>${l[2]}</a></li>`).join("");
$("#soc").innerHTML = links.map(l => `<a class="mag" href="${l[1]}" target="_blank" rel="noopener" aria-label="${l[2]}"><i class="${l[0]}"></i></a>`).join("");
$("#fnav").innerHTML = $("#menu").innerHTML;
$("#copy").textContent = `© ${new Date().getFullYear()} ${C.name}. All rights reserved.`;

/* ---------- Mobile menu ---------- */
const menu = $("#menu"), bg = $("#bg");
const toggle = o => { menu.classList.toggle("open", o); bg.setAttribute("aria-expanded", o); bg.setAttribute("aria-label", o ? "Close menu" : "Open menu"); };
bg.onclick = () => toggle(!menu.classList.contains("open"));
$$("a", menu).forEach(a => a.onclick = () => toggle(false));
addEventListener("keydown", e => e.key === "Escape" && toggle(false));
$("#top").onclick = () => scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });

/* ---------- Form validation (no backend: opens the visitor's email app) ---------- */
$("#form").addEventListener("submit", e => {
  e.preventDefault(); const f = e.target; let ok = true;
  $$("input,textarea", f).forEach(i => {
    const v = i.value.trim(); let m = "";
    if (!v) m = "This field is required."; else if (i.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) m = "Enter a valid email address.";
    else if (i.name === "message" && v.length < 10) m = "Please write at least 10 characters.";
    i.setAttribute("aria-invalid", !!m); i.nextElementSibling.textContent = m; if (m) ok = false;
  });
  const msg = $("#fmsg");
  if (!ok) return msg.textContent = "Please fix the highlighted fields.";
  const d = Object.fromEntries(new FormData(f));
  location.href = `mailto:${C.email}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.message + "\n\nFrom: " + d.name + " (" + d.email + ")")}`;
  msg.textContent = "Your email app should open with this message ready. Nothing is sent until you press send there.";
});

/* ---------- Animations ---------- */
if (RM) { $("#pre").remove(); } else {
  gsap.registerPlugin(ScrollTrigger);
  gsap.set(".w>span", { yPercent: 115 }); gsap.set("[data-h]", { opacity: 0, y: 30 });
  gsap.timeline()
    .from("#pl span", { yPercent: 120, opacity: 0, stagger: .08, duration: .8, ease: "power4.out" })
    .to("#pre i", { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, .3)
    .from("#pt", { opacity: 0, y: 12 }, .9)
    .to("#pre", { yPercent: -100, duration: 1, ease: "power4.inOut" }, 2.1)
    .to("#h1 .w>span", { yPercent: 0, duration: 1.2, stagger: .09, ease: "power4.out" }, 2.6)
    .to("[data-h]", { opacity: 1, y: 0, stagger: .12, duration: .9, ease: "power3.out" }, 3)
    .from(".chip", { scale: 0, opacity: 0, stagger: .12, ease: "back.out(2)" }, 3.2)
    .set("#pre", { display: "none" });

  $$(".st").forEach(h => gsap.to($$(".w>span", h), { yPercent: 0, duration: 1, stagger: .06, ease: "power4.out", scrollTrigger: { trigger: h, start: "top 88%" } }));
  $$("[data-r]").forEach(el => gsap.from(el, { y: 60, opacity: 0, duration: .9, ease: "power3.out", scrollTrigger: { trigger: el, start: "top 92%" } }));
  $$(".im").forEach(el => gsap.from(el, { clipPath: "inset(0 100% 0 0)", duration: 1.2, ease: "power4.inOut", scrollTrigger: { trigger: el, start: "top 90%" } }));
  $$("[data-n]").forEach(el => { const o = { v: 0 }; gsap.to(o, { v: +el.dataset.n, duration: 2, ease: "power2.out", scrollTrigger: { trigger: el, start: "top 92%" }, onUpdate: () => el.textContent = Math.round(o.v) }); });
  $$("[data-p]").forEach(el => gsap.to(el, { y: +el.dataset.p * 2, ease: "none", scrollTrigger: { trigger: el.parentElement, scrub: true } }));
  gsap.to("#prog", { scaleX: 1, ease: "none", scrollTrigger: { scrub: .3, start: 0, end: "max" } });
  $$("main section").forEach(s => { const a = $(`#menu a[href="#${s.id}"]`); a && ScrollTrigger.create({ trigger: s, start: "top 50%", end: "bottom 50%", onToggle: t => a.classList.toggle("on", t.isActive) }); });
}
addEventListener("scroll", () => $("#top").classList.toggle("show", scrollY > 400), { passive: true });

/* ---------- Desktop-only interactions ---------- */
if (FINE && !RM) {
  const cx = gsap.quickTo("#cr", "x", { duration: .35 }), cy = gsap.quickTo("#cr", "y", { duration: .35 });
  addEventListener("mousemove", e => { gsap.set("#cd", { x: e.clientX, y: e.clientY }); cx(e.clientX); cy(e.clientY); });
  document.addEventListener("mouseover", e => $("#cr").classList.toggle("on", !!e.target.closest("a,button,.card,input,textarea")));
  $$(".mag").forEach(el => {
    el.addEventListener("mousemove", e => { const r = el.getBoundingClientRect(); gsap.to(el, { x: (e.clientX - r.left - r.width / 2) * .3, y: (e.clientY - r.top - r.height / 2) * .3, duration: .4 }); });
    el.addEventListener("mouseleave", () => gsap.to(el, { x: 0, y: 0, duration: 1, ease: "elastic.out(1,.4)" }));
  });
  $$(".tilt").forEach(el => {
    el.addEventListener("mousemove", e => {
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty("--mx", (x + .5) * 100 + "%"); el.style.setProperty("--my", (y + .5) * 100 + "%");
      gsap.to(el, { rotationY: x * 10, rotationX: -y * 10, transformPerspective: 900, duration: .5 });
    });
    el.addEventListener("mouseleave", () => gsap.to(el, { rotationX: 0, rotationY: 0, duration: .8 }));
  });
}

/* ---------- Neon particles (lightweight canvas) ---------- */
(() => {
  const cv = $("#fx"), ctx = cv.getContext("2d"); let W, H, P = [], run = true;
  const size = () => { W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; P = Array.from({ length: W < 700 ? 35 : 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .6, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3 })); };
  size(); addEventListener("resize", size);
  new IntersectionObserver(e => run = e[0].isIntersecting).observe(cv);
  (function draw() {
    if (run && !RM) {
      ctx.clearRect(0, 0, W, H);
      P.forEach((p, i) => {
        p.x = (p.x + p.vx + W) % W; p.y = (p.y + p.vy + H) % H;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fillStyle = "rgba(0,184,255,.85)"; ctx.shadowColor = "#00b8ff"; ctx.shadowBlur = 10; ctx.fill();
        for (let j = i + 1; j < P.length; j++) { const d = Math.hypot(p.x - P[j].x, p.y - P[j].y); if (d < 110) { ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(0,184,255,${.15 * (1 - d / 110)})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke(); } }
      });
    }
    requestAnimationFrame(draw);
  })();
})();

</script>
</body>
</html>
